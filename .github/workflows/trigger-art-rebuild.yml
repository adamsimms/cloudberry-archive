# Trigger art Cloudberry archive rebuild
#
# Art Pages deploys on a push to adamsimms/art.adamsimms.xyz main
# (see that repo's .github/workflows/deploy.yml).
#
# This hook pushes an empty commit there with a write deploy key, which
# starts that workflow. The key is repository secret ART_DEPLOY_KEY.
# It can only write to the art repo, and it does not expire.
name: Trigger art archive rebuild

on:
  push:
    branches:
      - main
    paths:
      - 'js/**'
      - 'css/**'
      - 'data/catalog.json'
      - 'scripts/build-static-archive.php'
      - 'scripts/build-catalog.php'
      - 'images/**'
      - 'vendor/bootstrap/**'
      - 'vendor/gsap/**'
      - 'favicon/**'
      - '.github/workflows/trigger-art-rebuild.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    name: Push archive rebuild to art.adamsimms.xyz
    runs-on: ubuntu-latest
    steps:
      - name: Push archive rebuild commit
        env:
          ART_DEPLOY_KEY: ${{ secrets.ART_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ART_DEPLOY_KEY}" ]; then
            echo "::error::ART_DEPLOY_KEY is not set. Add the write deploy key for adamsimms/art.adamsimms.xyz as this secret."
            exit 1
          fi
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${ART_DEPLOY_KEY}" > "${HOME}/.ssh/art_deploy_key"
          chmod 600 "${HOME}/.ssh/art_deploy_key"
          ssh-keyscan -t ed25519 github.com >> "${HOME}/.ssh/known_hosts"
          export GIT_SSH_COMMAND="ssh -i ${HOME}/.ssh/art_deploy_key -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:adamsimms/art.adamsimms.xyz.git "${RUNNER_TEMP}/art-trigger"
          cd "${RUNNER_TEMP}/art-trigger"
          git -c user.name="Cloudberry archive" -c user.email="cloudberry-archive@users.noreply.github.com" \
            commit --allow-empty -m "Rebuild the Cloudberry archive from pinchards.is (${GITHUB_SHA})."
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed archive rebuild for pinchards ${GITHUB_SHA}"
              exit 0
            fi
            git pull --rebase origin main
            sleep 2
          done
          echo "::error::Could not push the archive rebuild commit to art.adamsimms.xyz."
          exit 1
